name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: DSP, settings and protocol regressions
        run: timeout 120 ./tests/run-host-tests.sh
      - name: Dashboard fixture tests
        run: node tests/web-ui-test.mjs

  firmware:
    needs: host-tests
    runs-on: ubuntu-24.04
    container: espressif/idf:v5.5.4
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Build and package ESP32-P4 firmware
        shell: bash
        run: |
          . "$IDF_PATH/export.sh"
          ./scripts/package-firmware.sh
      - name: Upload installable firmware
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ESPAirspy-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 30

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: firmware
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ESPAirspy-${{ github.sha }}
          path: dist
      - name: Publish versioned firmware release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          cd dist
          sha256sum --check SHA256SUMS
          gh release create "$RELEASE_TAG" ./* --verify-tag --generate-notes --title "ESPAirspy $RELEASE_TAG"
