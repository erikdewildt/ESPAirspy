name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: DSP, settings and protocol regressions
        run: timeout 120 ./tests/run-host-tests.sh
      - name: Dashboard fixture tests
        run: node tests/web-ui-test.mjs

  firmware:
    needs: host-tests
    runs-on: ubuntu-24.04
    container: espressif/idf:v5.5.4
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Build and package ESP32-P4 firmware
        shell: bash
        run: |
          . "$IDF_PATH/export.sh"
          ./scripts/package-firmware.sh
      - name: Upload installable firmware
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ESPAirspy-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 30

  release:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs: firmware
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ESPAirspy-${{ github.sha }}
          path: dist
      - name: Publish versioned firmware release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          cd dist
          sha256sum --check SHA256SUMS
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            RELEASE_TAG="$GITHUB_REF_NAME"
          else
            VERSION=$(sed -n 's/^Firmware: //p' BUILD-INFO.txt)
            [[ "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
            RELEASE_TAG="v$VERSION"
          fi

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists; no duplicate release created."
            exit 0
          fi

          if [[ "$GITHUB_REF_TYPE" == branch ]]; then
            LATEST_TAG=$(gh release view --json tagName --jq .tagName 2>/dev/null || true)
            if [[ -n "$LATEST_TAG" ]]; then
              LATEST_VERSION="${LATEST_TAG#v}"
              RELEASE_VERSION="${RELEASE_TAG#v}"
              HIGHEST_VERSION=$(printf '%s\n%s\n' "$LATEST_VERSION" "$RELEASE_VERSION" | sort -V | tail -n1)
              if [[ "$HIGHEST_VERSION" != "$RELEASE_VERSION" ]]; then
                echo "Refusing to publish $RELEASE_TAG: latest release is $LATEST_TAG." >&2
                exit 1
              fi
            fi

            EXISTING_TAG_SHA=$(gh api "repos/$GH_REPO/commits/$RELEASE_TAG" --jq .sha 2>/dev/null || true)
            if [[ -n "$EXISTING_TAG_SHA" && "$EXISTING_TAG_SHA" != "$GITHUB_SHA" ]]; then
              echo "Tag $RELEASE_TAG already points to a different commit." >&2
              exit 1
            fi
            gh release create "$RELEASE_TAG" ./* --target "$GITHUB_SHA" --generate-notes --title "ESPAirspy $RELEASE_TAG"
          else
            gh release create "$RELEASE_TAG" ./* --verify-tag --generate-notes --title "ESPAirspy $RELEASE_TAG"
          fi
